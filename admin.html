<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>TechClie Créateur</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220"><meta name="robots" content="noindex"><meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="admin.webmanifest">
<style>
:root{--bg:#0b1220;--fg:#f4f7ff;--card:#131d33;--bd:#222f4d;--mu:#8fa0bf;--ac:#3b82f6;--ac2:#1d4ed8;--ok:#22c55e;--wa:#f59e0b;--bad:#ef4444;color-scheme:dark}
@media(prefers-color-scheme:light){:root{--bg:#f3f6fb;--fg:#0a1530;--card:#fff;--bd:#e2e8f2;--mu:#64748b;--ac:#2563eb;--ac2:#1d4ed8;--ok:#16a34a;--wa:#d97706;--bad:#dc2626;color-scheme:light}}
:root{box-sizing:border-box;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
*{-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.c{padding:16px 16px 24px;max-width:520px;margin:auto;animation:in .25s ease}@keyframes in{from{opacity:0;transform:translateY(6px)}}
h2{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:.3em 0 .5em}h3{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--mu);margin:24px 0 8px;font-weight:700}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:11px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
.top img{width:34px;height:34px;border-radius:10px}.top b{display:block;font-size:16px;line-height:1.1}.top span{font-size:12px;color:var(--mu)}
.b{display:block;width:100%;box-sizing:border-box;padding:14px;margin:10px 0;border:0;border-radius:14px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font:inherit;font-weight:700;text-align:center;text-decoration:none;box-shadow:0 4px 14px rgba(37,99,235,.28)}
.b.g{background:transparent;color:var(--fg);border:1px solid var(--bd);box-shadow:none}.b.s{width:auto;margin:0;padding:9px 14px;font-size:14px}.b.d{background:transparent;color:var(--bad);border:1px solid var(--bad);box-shadow:none}
input,select,textarea{width:100%;box-sizing:border-box;padding:13px 14px;margin:5px 0;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);border-color:transparent}
.k{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.m{color:var(--mu);font-size:14px;margin:4px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.who{display:flex;align-items:center;gap:11px;margin-bottom:8px}.who>div:nth-child(2){flex:1;min-width:0}
.av{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex:none}
.ch{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}.ch.ok{background:rgba(34,197,94,.15);color:var(--ok)}.ch.wa{background:rgba(245,158,11,.16);color:var(--wa)}.ch.bad{background:rgba(239,68,68,.15);color:var(--bad)}
.ln{display:flex;justify-content:space-between;padding:8px 0;border-top:1px dashed var(--bd);margin-top:6px}.ln b{font-size:17px}
.acts{display:flex;gap:8px;margin-top:6px}.acts .b{flex:1;margin:4px 0}
.sts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0}.st{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:13px}.st span{font-size:12px;color:var(--mu);font-weight:600}.st b{display:block;font-size:22px;letter-spacing:-.02em;margin-top:2px}
.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px;margin:10px 0}.seg button{flex:1;padding:10px 4px;border:0;border-radius:11px;background:transparent;color:var(--mu);font:inherit;font-size:14px;font-weight:700}.seg button.on{background:var(--ac);color:#fff}
.er,.okb{border-radius:12px;padding:11px 13px;font-size:14px;margin:10px 0}.er{background:rgba(239,68,68,.12);border:1px solid var(--bad);color:var(--bad)}.okb{background:rgba(34,197,94,.12);border:1px solid var(--ok);color:var(--ok)}
.ok{color:var(--ok)}.pwr{position:relative}.pwr input{padding-right:52px}.pwr button{position:absolute;right:4px;top:5px;height:42px;width:42px;border:0;background:none;color:var(--mu)}
.sp{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 30%,#17367f,#0b1220 70%);color:#fff}.sp img{width:104px;border-radius:26px;animation:pop .8s cubic-bezier(.2,1.4,.4,1)}@keyframes pop{from{transform:scale(.4);opacity:0}}
#nav{position:fixed;bottom:0;left:0;right:0;display:none;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border:0;background:none;color:var(--mu);font:inherit;font-size:11px;font-weight:700}#nav button.on{color:var(--ac)}
</style></head><body><div id="app"><div class="c"><p class="m">Chargement…</p></div></div><nav id="nav"></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script src="admin.js?v=2"></script>
<script src="admin2.js?v=2"></script></body></html>
