async function go(){const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(error)return login('Connexion refusée. Détail technique : '+(error.message||'erreur inconnue')+(/fetch|network|load/i.test(error.message||'')?' — la page n’arrive pas à joindre Supabase. Ouvre-la depuis son adresse en ligne (GitHub Pages), pas depuis le chat.':''));gate()}
async function gate(){const {data}=await sb.from('administrateurs').select('user_id').maybeSingle();if(!data){await sb.auth.signOut();return login('Accès refusé : ce compte n’est pas administrateur.')}box()}
async function box(){
  R('<div class="c"><p class="m">Chargement…</p></div>',1);
  const {data,error}=await sb.from('depots').select('id,type,montant_fc,numero_prezpay,statut,cree_le,profiles(nom,role,ville),forfaits(type,quantite)').order('cree_le',{ascending:false}).limit(100);
  if(error)return R(`<div class="c"><div class="er">${esc(error.message)}</div></div>`,1);
  const n=t=>data.filter(x=>x.type==t&&x.statut=='attente').length,l=data.filter(x=>x.type==tab);
  R(`<div class="c"><h2>Boîte des messages</h2><div class="seg"><button class="b ${tab=='forfait'?'':'g'}" onclick="tab='forfait';box()">Connects (${n('forfait')})</button><button class="b ${tab=='commission'?'':'g'}" onclick="tab='commission';box()">Commissions (${n('commission')})</button></div>${l.map(x=>`<div class="k"><b>${esc(x.profiles&&x.profiles.nom)}</b> <span class="m">${x.profiles&&x.profiles.role=='technicien'?'Technicien':'Chercheur'} · ${esc(x.profiles&&x.profiles.ville)}</span><br>${x.type=='forfait'?esc(x.forfaits&&x.forfaits.quantite)+(x.forfaits&&x.forfaits.type=='connects'?' connects':' propositions'):'Commission 10 %'}<p class="m">Dépôt PrezPay de ${esc(x.numero_prezpay)} · ${new Date(x.cree_le).toLocaleString('fr-FR')}<br>Montant : <b>${F(x.montant_fc)}</b></p>${x.statut=='attente'?`<button class="b" onclick="ok('${x.id}')">Confirmer le paiement</button>`:'<b class="ok">✓ Confirmé</b>'}</div>`).join('')||'<p class="m">Aucun message.</p>'}</div>`,1);
  if(!chan)chan=sb.channel('depots-live').on('postgres_changes',{event:'*',schema:'public',table:'depots'},()=>{if($('.seg'))box()}).subscribe()}
async function ok(id){const {error}=await sb.rpc('confirmer_depot',{p_depot:id});if(error)alert(error.message);box()}
async function set(){
  const {data}=await sb.from('parametres').select('valeur').eq('cle','depots_ouverts').single(),o=!data||data.valeur===true;
  R(`<div class="c"><h2>Réglages</h2><div class="k row"><span>Dépôts : <b>${o?'ouverts':'fermés'}</b></span><button class="b g s" onclick="dep(${!o})">${o?'Fermer':'Ouvrir'}</button></div><div class="k"><b>Changer le mot de passe</b><p class="m">4 à 19 caractères, avec au moins une lettre, un chiffre et un signe.</p><div id="msg"></div>${pwi('p1','Nouveau mot de passe',19)}${pwi('p2','Confirmer le nouveau',19)}<button class="b" onclick="cp()">Enregistrer</button></div></div>`,1)}
async function dep(v){const {error}=await sb.rpc('regler_depots',{p_ouvert:v});if(error)alert(error.message);set()}
async function cp(){
  const p=$('#p1').value,e=(m,g)=>{$('#msg').innerHTML=`<div class="${g?'okb':'er'}">${esc(m)}</div>`};
  if(p.length<4||p.length>19)return e('Le mot de passe doit avoir entre 4 et 19 caractères.');
  if(!/[A-Za-z]/.test(p)||!/\d/.test(p)||!/[^A-Za-z0-9]/.test(p))return e('Ajoute au moins une lettre, un chiffre et un signe.');
  if(p!=$('#p2').value)return e('Les deux mots de passe sont différents.');
  const {error}=await sb.auth.updateUser({password:p});error?e(error.message):e('Mot de passe modifié ✓',1)}
async function out(){await sb.auth.signOut();login()}
window.addEventListener('error',e=>{$('#app').innerHTML='<div class="c"><div class="er">Erreur : '+esc(e.message)+'</div></div>'});
start().catch(e=>{$('#app').innerHTML='<div class="c"><div class="er">Erreur : '+esc(e&&e.message||e)+'</div></div>'});
</script></body></html>
