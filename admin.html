<html lang="fr"><head><meta charset="utf-8"><title>TechClie Créateur</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<script>(function(){try{var p=localStorage.getItem('tc_theme')||'auto',l=matchMedia('(prefers-color-scheme: light)').matches;document.documentElement.dataset.theme=p=='auto'?(l?'light':'dark'):p}catch(e){document.documentElement.dataset.theme='dark'}})()</script>
<style>
:root{--bg:#0f1115;--card:#1a1d27;--bd:#2c3140;--bd2:#3a4050;--fg:#f2f4f8;--mu:#9aa3b5;--ac:#6aa8ff;--acf:#0b1020;--inp:#12151c;--navbg:#0b0d11;--mg:linear-gradient(180deg,#202020 0%,#3a3a3a 55%,#5e5e5e 100%);--bad:#ff7b7b;--ok:#4ade80;--wa:#fbbf24;color-scheme:dark}
[data-theme=light]{--bg:#f0f2f6;--card:#fff;--bd:#dfe3ea;--bd2:#c9cfd9;--fg:#0c0f14;--mu:#5d6675;--ac:#0b5fd8;--acf:#fff;--inp:#fff;--navbg:#fff;--mg:linear-gradient(180deg,#1b78d8 0%,#2a9bf5 38%,#8cc8fb 78%,#dcefff 100%);--bad:#d32f2f;--ok:#15803d;--wa:#b45309;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px));transition:background .25s,color .25s}
body.mt{background:var(--mg);background-attachment:fixed}
.sp{position:fixed;inset:0;z-index:99;background:#001433;display:flex;align-items:center;justify-content:center;transition:opacity .35s}.sp.out{opacity:0;pointer-events:none}.sp img{width:247px;height:247px;transform:translate(-6px,-14px)}.dg{position:absolute;background-image:radial-gradient(rgba(150,190,255,.4) 1.6px,transparent 1.9px);background-size:13px 13px;opacity:0;animation:fi .9s .15s forwards;-webkit-mask-image:linear-gradient(135deg,#000 0%,transparent 85%);mask-image:linear-gradient(135deg,#000 0%,transparent 85%)}
.dg.a{left:18px;top:calc(40px + env(safe-area-inset-top,0px));width:130px;height:200px}.dg.b{right:22px;top:28%;width:90px;height:110px}.dg.c{left:20px;bottom:20%;width:90px;height:120px}.dg.d{right:18px;bottom:calc(30px + env(safe-area-inset-bottom,0px));width:140px;height:190px}
@keyframes fi{to{opacity:1}}@keyframes rot{to{transform:rotate(360deg)}}
.stl{position:absolute;left:0;right:0;top:calc(50% + 84px);text-align:center;font-size:12px;font-weight:600;letter-spacing:.2em;color:#cfe0ff;opacity:0;animation:fi 1s .5s forwards}
.spn{position:absolute;left:50%;top:calc(50% + 128px);width:22px;height:22px;margin-left:-11px;border-radius:50%;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;opacity:0;animation:fi .4s 1.2s forwards,rot .8s 1.2s linear infinite}
.dts{display:flex;gap:9px}.dts i{width:10px;height:10px;border-radius:50%;background:var(--mu);opacity:.3;animation:bl 1s infinite}.dts i:nth-child(2){animation-delay:.15s}.dts i:nth-child(3){animation-delay:.3s}
.ld{position:absolute;bottom:calc(56px + env(safe-area-inset-bottom,0px));display:flex;gap:7px}.ld i{width:7px;height:7px;border-radius:50%;background:#fff;opacity:.3;animation:bl 1s infinite}.ld i:nth-child(2){animation-delay:.15s}.ld i:nth-child(3){animation-delay:.3s}@keyframes bl{50%{opacity:1}}
.hbar{border-bottom:1px solid var(--bd);margin-bottom:8px}.hdw{display:flex;align-items:center;gap:14px;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 4px;max-width:560px;margin:auto}
.hdw img{width:56px;height:56px;border-radius:50%;flex:none}.app{display:block;color:var(--ac);font-size:15px;font-weight:600}.pt{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.tl{display:flex;gap:10px;flex-wrap:wrap;padding:12px 16px 16px;max-width:560px;margin:auto}
.ob{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border:1px solid var(--bd2);background:var(--card);color:var(--fg);border-radius:10px;font:inherit;font-weight:700}.ob svg{width:20px;height:20px}
.c{padding:6px 16px 24px;max-width:560px;margin:auto;animation:in .25s ease}@keyframes in{from{opacity:0;transform:translateY(6px)}}
h2{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:.5em 0 .5em}h3{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:26px 0 8px;font-weight:700}
.b{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;margin:10px 0;border:1px solid transparent;border-radius:10px;background:var(--ac);color:var(--acf);font:inherit;font-weight:700;text-decoration:none}
.b.g{background:transparent;border-color:var(--ac);color:var(--ac)}.b.d{background:transparent;border-color:var(--bad);color:var(--bad)}.b.s{width:auto;margin:0;padding:10px 16px;font-size:14px}
input,select,textarea{width:100%;padding:14px 15px;margin:6px 0;border-radius:10px;border:1px solid var(--bd2);background:var(--inp);color:var(--fg);font:inherit}
input::placeholder,textarea::placeholder{color:var(--mu);opacity:.8}input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);border-color:transparent}
.k{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:12px 0}
.k.nv{position:relative;padding-right:40px}.k.nv::after{content:"";position:absolute;right:17px;top:50%;width:8px;height:8px;border-right:2px solid var(--mu);border-top:2px solid var(--mu);transform:translateY(-50%) rotate(45deg)}
.m{color:var(--mu);font-size:14px;margin:4px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.who{display:flex;align-items:center;gap:12px;margin-bottom:8px}.who>div:nth-child(2){flex:1;min-width:0}
.av{width:44px;height:44px;border-radius:50%;background:var(--ac);color:var(--acf);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex:none}
.ch{font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;white-space:nowrap;border:1px solid currentColor}.ch.ok{color:var(--ok)}.ch.wa{color:var(--wa)}.ch.bad{color:var(--bad)}
.ln{display:flex;justify-content:space-between;padding:9px 0;border-top:1px dashed var(--bd2);margin-top:6px}.ln b{font-size:17px}
.acts{display:flex;gap:8px;margin-top:6px}.acts .b{flex:1;margin:4px 0}
.sts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0}.st{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}.st span{font-size:13px;color:var(--mu);font-weight:600}.st b{display:block;font-size:26px;letter-spacing:-.02em;margin-top:2px}
.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px;margin:10px 0}.seg button{flex:1;padding:11px 4px;border:0;border-radius:9px;background:transparent;color:var(--mu);font:inherit;font-size:14px;font-weight:700}.seg button.on{background:var(--ac);color:var(--acf)}
.er,.okb{border-radius:10px;padding:12px 14px;font-size:14px;margin:10px 0}.er{border:1px solid var(--bad);color:var(--bad)}.okb{border:1px solid var(--ok);color:var(--ok)}
.ok{color:var(--ok)}.pwr{position:relative}.pwr input{padding-right:52px}.pwr button{position:absolute;right:4px;top:6px;height:44px;width:44px;border:0;background:none;color:var(--mu);display:flex;align-items:center;justify-content:center}
.lg{padding-top:calc(48px + env(safe-area-inset-top,0px));text-align:center}.lg>img{width:88px;height:88px;border-radius:50%}.lg .k{text-align:left}
.mth{display:flex;justify-content:space-between;align-items:center;padding:calc(26px + env(safe-area-inset-top,0px)) 4px 16px}.mth h1{font-size:38px;font-weight:800;letter-spacing:-.02em;color:#fff;margin:0}.mtg{background:none;border:0;color:#fff;padding:8px}.mtg svg{width:28px;height:28px}
.srch{position:relative;margin:4px 0 18px}.srch svg{position:absolute;left:20px;top:19px;color:#1976d2;width:24px;height:24px}.srch input{height:62px;margin:0;border:0;border-radius:24px;padding:0 20px 0 58px;background:#fff;color:#222;font-size:17px;box-shadow:0 8px 20px rgba(0,0,0,.2)}.srch input::placeholder{color:#9aa0a8}
.mi{display:flex;align-items:center;gap:16px;padding:18px;margin:14px 0;border-radius:28px;background:rgba(255,255,255,.13);color:#fff}.mi .bd{width:56px;height:56px;border-radius:50%;background:rgba(45,134,240,.3);color:#3d8ff2;display:flex;align-items:center;justify-content:center;flex:none}
.mi>div{flex:1;min-width:0}.mi b{display:block;font-size:20px;font-weight:700;line-height:1.2}.mi small{display:block;font-size:13px;color:#c3cad5;margin-top:3px}.mi>svg{color:#3d8ff2;flex:none}
[data-theme=light] .mi{background:linear-gradient(135deg,rgba(255,255,255,.97),rgba(226,240,253,.9));color:#0d47a1;box-shadow:0 6px 18px rgba(10,60,130,.14)}[data-theme=light] .mi .bd{background:#cfe6fb;color:#1565c0}[data-theme=light] .mi small{color:#4f7fb8}[data-theme=light] .mi>svg{color:#1e88e5}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:none;background:var(--navbg);border-top:1px solid var(--bd);padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px))}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;border:0;background:transparent;color:var(--mu);font:inherit;font-size:12px;font-weight:600}#nav button.on{color:var(--fg);font-weight:800}
</style></head><body>
<div id="sp" class="sp"><i class="dg a"></i><i class="dg b"></i><i class="dg c"></i><i class="dg d"></i><img src="icon-512.png" alt=""><div class="stl">ESPACE CRÉATEUR</div><div class="spn"></div></div>
<div id="app"></div><nav id="nav"></nav>
