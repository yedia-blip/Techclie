<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>TechClie Créateur</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#001433"><meta name="robots" content="noindex"><meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="admin.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<script>(function(){try{var p=localStorage.getItem('tc_theme')||'auto',l=matchMedia('(prefers-color-scheme: light)').matches;document.documentElement.dataset.theme=p=='auto'?(l?'light':'dark'):p}catch(e){document.documentElement.dataset.theme='dark'}})()</script>
<style>
:root{--bg:#001433;--fg:#f3f7ff;--card:#112448;--card2:#173160;--bd:#21407a;--mu:#9bb0d3;--ac:#3b82f6;--ac2:#2563eb;--acs:rgba(96,165,250,.16);--ok:#34d399;--wa:#fbbf24;--bad:#f87171;--sh:0 10px 28px rgba(0,0,0,.35);color-scheme:dark}
[data-theme=light]{--bg:#eef3fb;--fg:#0b1530;--card:#fff;--card2:#f3f6fc;--bd:#e0e8f4;--mu:#5b6b88;--ac:#2563eb;--ac2:#1d4ed8;--acs:rgba(37,99,235,.10);--ok:#059669;--wa:#d97706;--bad:#dc2626;--sh:0 8px 24px rgba(25,50,100,.09);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(100px + env(safe-area-inset-bottom,0px));transition:background .25s,color .25s}
.sp{position:fixed;inset:0;z-index:99;background:#001433;display:flex;align-items:center;justify-content:center;transition:opacity .35s}.sp.out{opacity:0;pointer-events:none}.sp img{width:176px;height:176px}
.ld{position:absolute;bottom:calc(56px + env(safe-area-inset-bottom,0px));display:flex;gap:7px}.ld i{width:7px;height:7px;border-radius:50%;background:#fff;opacity:.3;animation:bl 1s infinite}.ld i:nth-child(2){animation-delay:.15s}.ld i:nth-child(3){animation-delay:.3s}@keyframes bl{50%{opacity:1}}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:var(--bg)}
.top img{width:38px;height:38px;border-radius:11px}.top div{flex:1}.top b{display:block;font-size:17px;line-height:1.1;font-weight:800}.top span{font-size:12px;color:var(--mu)}
.tg{width:42px;height:42px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--fg);display:flex;align-items:center;justify-content:center;padding:0}
.c{padding:6px 16px 24px;max-width:560px;margin:auto;animation:in .25s ease}@keyframes in{from{opacity:0;transform:translateY(6px)}}
h2{font-size:28px;font-weight:800;letter-spacing:-.03em;margin:.35em 0 .55em}h3{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--mu);margin:24px 0 8px;font-weight:700}
.b{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;margin:10px 0;border:0;border-radius:16px;background:var(--ac);color:#fff;font:inherit;font-weight:700;text-decoration:none;box-shadow:0 6px 16px rgba(37,99,235,.28)}
.b.g{background:var(--acs);color:var(--ac);box-shadow:none}.b.d{background:rgba(248,113,113,.14);color:var(--bad);box-shadow:none}.b.s{width:auto;margin:0;padding:10px 16px;font-size:14px;border-radius:13px}
input,select,textarea{width:100%;padding:14px 15px;margin:6px 0;border-radius:14px;border:1px solid var(--bd);background:var(--card2);color:var(--fg);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);border-color:transparent}
.k{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:16px;margin:12px 0;box-shadow:var(--sh)}
.k.nv{position:relative;padding-right:40px}.k.nv::after{content:"";position:absolute;right:17px;top:50%;width:8px;height:8px;border-right:2px solid var(--mu);border-top:2px solid var(--mu);transform:translateY(-50%) rotate(45deg)}
.m{color:var(--mu);font-size:14px;margin:4px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.who{display:flex;align-items:center;gap:12px;margin-bottom:8px}.who>div:nth-child(2){flex:1;min-width:0}
.av{width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex:none}
.ch{font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;white-space:nowrap}.ch.ok{background:rgba(52,211,153,.16);color:var(--ok)}.ch.wa{background:rgba(251,191,36,.18);color:var(--wa)}.ch.bad{background:rgba(248,113,113,.16);color:var(--bad)}
.ln{display:flex;justify-content:space-between;padding:9px 0;border-top:1px dashed var(--bd);margin-top:6px}.ln b{font-size:17px}
.acts{display:flex;gap:8px;margin-top:6px}.acts .b{flex:1;margin:4px 0}
.sts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0}.st{border-radius:22px;padding:16px;background:linear-gradient(145deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 10px 24px rgba(37,99,235,.3)}.st span{font-size:12px;font-weight:600;opacity:.85}.st b{display:block;font-size:26px;letter-spacing:-.03em;margin-top:2px}
.seg{display:flex;gap:4px;background:var(--card2);border-radius:16px;padding:4px;margin:10px 0}.seg button{flex:1;padding:11px 4px;border:0;border-radius:13px;background:transparent;color:var(--mu);font:inherit;font-size:14px;font-weight:700}.seg button.on{background:var(--ac);color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.3)}
.er,.okb{border-radius:14px;padding:12px 14px;font-size:14px;margin:10px 0}.er{background:rgba(248,113,113,.12);border:1px solid var(--bad);color:var(--bad)}.okb{background:rgba(52,211,153,.12);border:1px solid var(--ok);color:var(--ok)}
.ok{color:var(--ok)}.pwr{position:relative}.pwr input{padding-right:52px}.pwr button{position:absolute;right:4px;top:6px;height:44px;width:44px;border:0;background:none;color:var(--mu);display:flex;align-items:center;justify-content:center}
.lg{padding-top:calc(44px + env(safe-area-inset-top,0px));text-align:center}.lg>img{width:88px;height:88px;border-radius:26px;box-shadow:var(--sh)}.lg .k{text-align:left}
#nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:10;display:none;gap:4px;padding:6px;background:var(--card);border:1px solid var(--bd);border-radius:26px;box-shadow:0 12px 34px rgba(0,0,0,.28);max-width:536px;margin:auto}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;border:0;border-radius:20px;background:transparent;color:var(--mu);font:inherit;font-size:11px;font-weight:700;transition:background .2s,color .2s}#nav button.on{background:var(--acs);color:var(--ac)}
</style></head><body>
<div id="sp" class="sp"><img src="icon-512.png" alt=""><div class="ld"><i></i><i></i><i></i></div></div>
<div id="app"></div><nav id="nav"></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script src="admin.js?v=3"></script>
<script src="admin2.js?v=3"></script>
</body></html>
