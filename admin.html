  if(a&&a.nextLevel=='aal2'&&a.currentLevel!='aal2')return R(`<div class="c" style="padding-top:56px"><h2>Double vérification</h2><p class="m">Entre le code à 6 chiffres de ton application d’authentification.</p><input id="cd" inputmode="numeric" maxlength="6" placeholder="Code à 6 chiffres"><button class="b" onclick="mfaGo()">Valider</button><button class="b g" onclick="out()">Annuler</button></div>`);
  const {data}=await sb.from('administrateurs').select('user_id').maybeSingle();if(!data){await sb.auth.signOut();return login('Accès refusé : ce compte n’est pas administrateur.')}box()}
async function mfaGo(){const {data:f}=await sb.auth.mfa.listFactors(),t=f&&f.totp&&f.totp[0];if(!t)return gate();const {error}=await sb.auth.mfa.challengeAndVerify({factorId:t.id,code:$('#cd').value.trim()});if(error)return ER('Code refusé : il est incorrect ou expiré.');gate()}
